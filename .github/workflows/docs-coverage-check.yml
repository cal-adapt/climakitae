name: docs-coverage-check

on:
    pull_request:
        paths:
            - "climakitae/**/*.py"
    workflow_dispatch:

jobs:
    check-coverage:
        name: Check for modules missing from docs-mkdocs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Compare source modules against docs-mkdocs references
              run: |
                  # Modules with a top-level def/class, excluding tests, __init__,
                  # and files that are auto-generated / dev-only / not public API.
                  find climakitae -name "*.py" \
                      ! -path "*/tests/*" \
                      ! -name "__init__.py" \
                      ! -name "_version.py" \
                      ! -name "template.py" \
                      ! -name "dev_logging.py" \
                      ! -name "generate_gwl_*.py" \
                      -exec grep -lE '^(def |class )' {} \; \
                      | sed 's/\.py$//; s/\//./g' | sort -u > source_modules.txt

                  # Modules referenced anywhere via a mkdocstrings ":::" directive
                  grep -rhoE '^\s*:::\s*[A-Za-z0-9_.]+' docs-mkdocs --include='*.md' \
                      | awk '{print $2}' | sort -u > documented_refs.txt

                  # Some modules (e.g. the processors) are documented as hand-written
                  # narrative pages instead of via "::: ", named after the module itself.
                  find docs-mkdocs -name "*.md" -exec basename {} .md \; | sort -u > documented_basenames.txt

                  missing=0
                  while read -r mod; do
                      base="${mod##*.}"
                      if grep -qE "^${mod}(\.|$)" documented_refs.txt; then
                          continue
                      fi
                      if grep -qxF "$base" documented_basenames.txt; then
                          continue
                      fi
                      echo "::warning::${mod} has no ':::' directive and no matching page in docs-mkdocs/ (docs may be falling behind)"
                      missing=$((missing + 1))
                  done < source_modules.txt

                  echo "$missing module(s) with no docs-mkdocs reference (report-only, does not fail the build)."
